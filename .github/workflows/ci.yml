name: ci

# Checks every proof, builds the extracted mutator, runs the bridge and checker tests and
# a short end-to-end run on SQLite and on MariaDB.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coq-8-18:
    name: Coq 8.18 (Ubuntu package), tests, SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Coq, OCaml and Python packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends coq ocaml ocaml-findlib make gcc
          python3 -m pip install --break-system-packages -r requirements.txt pyflakes
      - name: Check the proofs and build the mutator
        run: make && make cli
      - name: Old SQLite releases (with column metadata)
        run: bridge/build_old_sqlite.sh /tmp/sqlite-libs
      - name: Tests (proof assumptions, abstract rules, bridge, checker)
        run: SQLITE_LIBS=/tmp/sqlite-libs make test
      - name: Newest SQLite release, built from source (the reference library)
        run: |
          git clone -q --depth 1 --branch version-3.54.1 https://github.com/sqlite/sqlite /tmp/sqlite-src
          python3 bridge/bisect_sqlite.py --build version-3.54.1 --src /tmp/sqlite-src --cache /tmp/sqlite-cache | tee /tmp/latest-lib
      - name: Replay the recorded, reduced SQLite pairs on the releases that reported them
        # every known bug must still be detected (a change of the checker that hides one fails
        # here), and no pair may be violated on the newest release
        run: |
          L=/tmp/sqlite-libs
          scripts/replay_reduced_sqlite.py --lib 3.26.0=$L/libsqlite3-3260000.so --lib 3.30.1=$L/libsqlite3-3300100.so --lib 3.31.1=$L/libsqlite3-3310100.so --lib 3.34.0=$L/libsqlite3-3340000.so --latest "$(tail -n 1 /tmp/latest-lib)"
      - name: End to end on SQLite
        # the SQLite of ubuntu-24.04 (3.45.1); the old releases above are tested by the campaign
        run: N=60 scripts/demo.sh sqlite
      - name: No violation outside the baseline (SQLite demo)
        run: scripts/check_violations.py out/violations.jsonl data/ci-baseline/sqlite-demo.txt
      - name: SQLite campaign on two old releases (small)
        run: |
          L=/tmp/sqlite-libs
          python3 bridge/campaign_sqlite.py --value-ext --latest "$(tail -n 1 /tmp/latest-lib)" --libs $L/libsqlite3-3260000.so $L/libsqlite3-3340000.so --seeds 1001-1003 --queries 20 --out /tmp/violations.jsonl
          scripts/check_violations.py /tmp/violations.jsonl data/ci-baseline/sqlite-campaign.txt
      - name: Reduce a recorded violation (smoke test)
        run: |
          python3 bridge/reduce_sqlite.py results/sqlite-confirmed.jsonl --pair 5 --lib 3.26.0=/tmp/sqlite-libs/libsqlite3-3260000.so | tee /tmp/reduced.txt
          grep -q '^-- pair 5' /tmp/reduced.txt

  rocq-9:
    name: Rocq 9 (opam)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
      - name: Install Rocq 9
        run: opam install -y rocq-prover ocamlfind
      - name: Check the proofs and build the mutator
        run: opam exec -- make && opam exec -- make cli
      - name: Tests
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt pyflakes
          opam exec -- make test
      - name: End to end on SQLite (rocq c for the axiom report)
        run: N=40 opam exec -- scripts/demo.sh sqlite
      - name: No violation outside the baseline
        run: scripts/check_violations.py out/violations.jsonl data/ci-baseline/sqlite-demo.txt

  mariadb:
    name: MariaDB 10.11, end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: "123456"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - name: Install Coq, OCaml, the MariaDB client and Python packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends coq ocaml ocaml-findlib make gcc mariadb-client
          python3 -m pip install --break-system-packages -r requirements.txt pyflakes
      - name: Load the sample database
        run: YES=1 scripts/setup_mariadb.sh
      - name: Server tests (collations of compounds, decoding, grouping)
        run: python3 bridge/test_mysql.py
      - name: End to end on MariaDB
        run: N=60 scripts/demo.sh mariadb
      - name: No violation outside the baseline (issues 005, 006, 009, 010 are known)
        run: scripts/check_violations.py out/violations.jsonl data/ci-baseline/mariadb.txt
      - name: The AVG candidate of issue 009
        run: mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/avg-distinct.sql
      - name: "The candidates of issues 002 (same groups everywhere) and 003 (expected 1, 2, 1)"
        run: |
          mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/enum-max-having.sql
          mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/having-count-in.sql
      - name: "The candidate of issue 010: window and SUM(DISTINCT) in a grouped join (expected 2 rows, except where noted)"
        run: mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/window-sum-distinct-having.sql
      - name: "The candidate of issue 011: GROUP BY on a DOUBLE(M,D) expression (expected the same count in each block)"
        run: mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/double-md-group.sql
      - name: "The candidates of issues 012 (NULL everywhere, 0 rows) and 013 (1 group everywhere, equal 1)"
        run: |
          mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/in-date-index-null.sql
          mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/decimal-negative-zero.sql
      - name: "The candidate of issue 014: subquery cache and two collations (expected 0 for A, 1 for a, row 2)"
        run: mariadb -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mariadb/subquery-cache-collation.sql || true
      - name: "issue 003, the pair of the campaign on MariaDB 11.8 (expected 2 in every line)"
        run: mariadb -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/having-in-nested.sql || true
      - name: The recorded pairs of the MariaDB campaigns judged again (a change of the checker must not hide them)
        # 10.11.19 in CI and 10.11.14 locally give the same verdicts (round 18)
        run: python3 scripts/recheck_recorded.py --password 123456
      - name: Reduce the pair of issue 009 (test of bridge/reduce_mysql.py)
        run: |
          python3 bridge/reduce_mysql.py out/violations.jsonl --key 'expr->expr+k|38b7c18e86d54299' --password 123456 --database test > /tmp/reduced-009.sql
          cat /tmp/reduced-009.sql | grep -v '^  KEY'
          # the reduced script keeps the violation: run it in a fresh database and compare
          python3 scripts/check_reduced_mysql.py /tmp/reduced-009.sql 'Le col 0'
      - name: Reduce the translation mismatch of issue 010 (query as written vs re-printed)
        run: |
          python3 bridge/reduce_mysql.py out/violations.jsonl --key 'TRANSLATION|f0334db11f7ee317' --password 123456 --database test > /tmp/reduced-010.sql
          python3 scripts/check_reduced_mysql.py /tmp/reduced-010.sql Same --max-rows 20

  mysql:
    name: MySQL 8.4, end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "123456"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - name: Install Coq, OCaml, the MySQL client and Python packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends coq ocaml ocaml-findlib make gcc mysql-client
          # cryptography: PyMySQL needs it for MySQL 8's caching_sha2_password
          python3 -m pip install --break-system-packages -r requirements.txt cryptography pyflakes
      - name: Load the sample database
        run: YES=1 scripts/setup_mariadb.sh
      - name: Server tests (collations of compounds, decoding, grouping)
        run: python3 bridge/test_mysql.py
      - name: End to end on MySQL (MySQL-protocol runner, 300 queries of each kind)
        run: N=300 scripts/demo.sh mariadb
      - name: Rows of every violation (hex)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pymysql
          if not os.path.exists('out/violations.jsonl'):
              raise SystemExit
          c = pymysql.connect(host='127.0.0.1', user='root', password='123456', database='test')
          cur = c.cursor()
          for line in open('out/violations.jsonl'):
              r = json.loads(line)
              print('==', r['rule'], r['expect'])
              for k in ('original', 'mutant'):
                  cur.execute(r[k])
                  rows = sorted(repr(tuple(v.hex() if isinstance(v, bytes) else v for v in row)) for row in cur.fetchall())
                  print(k, len(rows), rows[:5])
          PY
      - name: The BIT candidates of issues 005 and 006 on MySQL
        run: |
          mysql_() { mysql -h127.0.0.1 -uroot -p123456 "$@"; }
          mysql_ -e "CREATE DATABASE IF NOT EXISTS vs_bit; USE vs_bit; CREATE TABLE b (x BIT(8)); INSERT INTO b VALUES (2), (242); SELECT HEX(MIN(x)), MIN(x) FROM b;" || true
          sed -n '/^DROP DATABASE IF EXISTS/,/^```/p' issues/006-mariadb-bit-subquery-loose-scan.md | grep -v '^```' | mysql_ --skip-column-names || true
          mysql_ --skip-column-names < data/mysql/bit-variants.sql || true
      - name: The INTERSECT ALL candidate of issue 008 on MySQL
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mysql/intersect-all-variants.sql || true
      - name: The reduced case of issue 008 on MySQL (plain tables)
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mysql/intersect-min.sql || true
      - name: The AVG candidate of issue 009 on MySQL
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/avg-distinct.sql || true
      - name: "issue 002: HAVING MAX(enum) <> 3 (expected the same groups, 1,2, in every query)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/enum-max-having.sql || true
      - name: "issue 003: HAVING COUNT(x) IN (subquery) (expected 1, 2, 1)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/having-count-in.sql || true
      - name: "issue 010: window and SUM(DISTINCT) in a grouped join (expected 2 in every line but the last)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/window-sum-distinct-having.sql || true
      - name: "issue 011: GROUP BY on a DOUBLE(M,D) expression (expected the same count in each block)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/double-md-group.sql || true
      - name: "issue 012: number IN (SELECT date ...) with a NULL and an index (expected NULL everywhere, 0 rows)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/in-date-index-null.sql || true
      - name: "issue 013: DECIMAL -0.00 in GROUP BY (expected 1 group everywhere, equal 1)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/decimal-negative-zero.sql || true
      - name: "issue 014: subquery cache and two collations (expected 0 for A, 1 for a, row 2)"
        run: mysql -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mariadb/subquery-cache-collation.sql || true
      - name: "issue 003, the pair of the campaign on MariaDB 11.8 (expected 2 in every line)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/having-in-nested.sql || true
      - name: "issue 008 (MySQL), second form: NULL INTERSECT 0 (expected no row after B1-B4 and B6, two rows after B5; W: 0 0 0 0 2 0)"
        run: mysql -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mysql/intersect-null-zero.sql || true
      - name: "issue 015 (MySQL): LEFT JOIN with EXISTS under NOT EXISTS on the constant 1 (expected 55 in every line, 1 for small)"
        run: mysql -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mysql/left-join-semijoin-antijoin.sql 2>&1 | grep -v "^-> \|EXPLAIN\|^---\|^$\|ERROR" || true
      - name: No violation outside the baseline (issues 005, 008 are known)
        run: scripts/check_violations.py out/violations.jsonl data/ci-baseline/mysql.txt
      - name: Reduce the pair of issue 008 (query and data)
        if: always()
        run: python3 bridge/reduce_mysql.py out/violations.jsonl --key 'DISTINCT-add|21963406b307e718' --password 123456 --database test || true
      - name: Campaign over random databases (the candidates are printed, not judged)
        if: always()
        run: |
          python3 bridge/campaign_mysql.py --seeds 1-12 --queries 40 --focus --value-ext --password 123456 --out /tmp/campaign.jsonl | grep -v '^  ' | cut -c1-1500
          if [ -s /tmp/campaign.jsonl ]; then python3 scripts/triage_mysql.py /tmp/campaign.jsonl --password 123456 --out-dir /tmp/triage --timeout 120; cat /tmp/triage/pair-*.sql 2>/dev/null | head -n 400; fi

  candidates-newer-servers:
    name: Candidate bugs and a campaign on newer servers (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "mariadb:11"
            health: "healthcheck.sh --connect --innodb_initialized"
            env_password: MARIADB_ROOT_PASSWORD
          - image: "mariadb:11.4"          # between 10.11 and 11.8: where issue 003 was fixed
            health: "healthcheck.sh --connect --innodb_initialized"
            env_password: MARIADB_ROOT_PASSWORD
          - image: "mysql:9"
            health: "mysqladmin ping -h 127.0.0.1 -p123456"
            env_password: MYSQL_ROOT_PASSWORD
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: "123456"
          MYSQL_ROOT_PASSWORD: "123456"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - name: Client and Python packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends mysql-client
          python3 -m pip install --break-system-packages -r requirements.txt cryptography pyflakes
      - name: Server version and sample database
        run: |
          mysql -h127.0.0.1 -uroot -p123456 -N -e "SELECT VERSION()"
          YES=1 scripts/setup_mariadb.sh
      - name: "issue 005: MIN of BIT(8)"
        run: mysql -h127.0.0.1 -uroot -p123456 -e "CREATE DATABASE IF NOT EXISTS vs_bit; USE vs_bit; CREATE TABLE b (x BIT(8)); INSERT INTO b VALUES (2), (242); SELECT HEX(MIN(x)), MIN(x) FROM b;" || true
      - name: "issue 006: BIT scalar subquery under a loose index scan (expected 14)"
        run: sed -n '/^DROP DATABASE IF EXISTS/,/^```/p' issues/006-mariadb-bit-subquery-loose-scan.md | grep -v '^```' | mysql -h127.0.0.1 -uroot -p123456 --skip-column-names || true
      - name: "issue 008: INTERSECT in a derived table (expected 0 everywhere)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mysql/intersect-all-variants.sql || true
      - name: "issue 008, reduced (expected 0 rows for every INTERSECT)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mysql/intersect-min.sql || true
      - name: "issue 009: AVG under SELECT DISTINCT (expected 1, 2, 3)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/avg-distinct.sql || true
      - name: "issue 002: HAVING MAX(enum) <> 3 (expected the same groups, 1,2, in every query)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/enum-max-having.sql || true
      - name: "issue 003: HAVING COUNT(x) IN (subquery) (expected 1, 2, 1)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/having-count-in.sql || true
      - name: "issue 010: window and SUM(DISTINCT) in a grouped join (expected 2 in every line but the last)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/window-sum-distinct-having.sql || true
      - name: "issue 011: GROUP BY on a DOUBLE(M,D) expression (expected the same count in each block)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/double-md-group.sql || true
      - name: "issue 012: number IN (SELECT date ...) with a NULL and an index (expected NULL everywhere, 0 rows)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/in-date-index-null.sql || true
      - name: "issue 013: DECIMAL -0.00 in GROUP BY (expected 1 group everywhere, equal 1)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/decimal-negative-zero.sql || true
      - name: "issue 014: subquery cache and two collations (expected 0 for A, 1 for a, row 2)"
        run: mysql -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mariadb/subquery-cache-collation.sql || true
      - name: "issue 003, the pair of the campaign on MariaDB 11.8 (expected 2 in every line)"
        run: mysql -h127.0.0.1 -uroot -p123456 --skip-column-names < data/mariadb/having-in-nested.sql || true
      - name: "issue 008 (MySQL), second form: NULL INTERSECT 0 (expected no row after B1-B4 and B6, two rows after B5; W: 0 0 0 0 2 0)"
        run: mysql -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mysql/intersect-null-zero.sql || true
      - name: "issue 015 (MySQL): LEFT JOIN with EXISTS under NOT EXISTS on the constant 1 (expected 55 in every line, 1 for small)"
        run: mysql -h127.0.0.1 -uroot -p123456 --force --skip-column-names < data/mysql/left-join-semijoin-antijoin.sql 2>&1 | grep -v "^-> \|EXPLAIN\|^---\|^$\|ERROR" || true
      - name: Build the mutator (for the campaign below)
        if: always()
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends coq ocaml ocaml-findlib make gcc
          make && make cli
      - name: Campaign over random databases on this server (the candidates are printed, not judged)
        if: always()
        run: |
          python3 bridge/campaign_mysql.py --seeds 1-12 --queries 40 --focus --value-ext --no-value-distinct --password 123456 --out /tmp/campaign.jsonl | grep -v '^  ' | cut -c1-1500
          if [ -s /tmp/campaign.jsonl ]; then python3 scripts/triage_mysql.py /tmp/campaign.jsonl --password 123456 --out-dir /tmp/triage --timeout 120; cat /tmp/triage/pair-*.sql 2>/dev/null | head -n 400; fi

  tidb:
    name: TiDB v8.5 (collation probe, issue 016, a small campaign)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      db:
        image: pingcap/tidb:v8.5.3
        ports: ["3306:4000"]
    steps:
      - uses: actions/checkout@v5
      - name: Install Coq, OCaml, the client and Python packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends coq ocaml ocaml-findlib make gcc mysql-client
          python3 -m pip install --break-system-packages -r requirements.txt cryptography
      - name: Check the proofs and build the mutator
        run: make && make cli
      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if mysql -h127.0.0.1 -uroot -N -e "SELECT VERSION()" 2> /dev/null; then exit 0; fi
            sleep 5
          done
          echo "the server did not start" >&2; exit 1
      - name: The bridge does not trust the collations TiDB reports for result columns
        run: |
          python3 scripts/probe_collations.py
          python3 -c "import sys, types; sys.path.insert(0, 'bridge'); from run_on_db import MySQLTarget; t = MySQLTarget(types.SimpleNamespace(host='127.0.0.1', port=3306, user='root', password='', database='mysql')); sys.exit(1 if t.trusted_collations else 0)"
      - name: "issue 016: NOT IN with a condition on the outer row (expected 1 in every line unless the tag says otherwise)"
        run: mysql -h127.0.0.1 -uroot --force --skip-column-names < data/tidb/not-in-correlated-empty.sql | grep -v "^[A-Z][a-zA-Z]*_[0-9]\|^[└├│ ]" || true
      - name: "issue 016 in a compound: the translation pair of seed 6 (expected the same count, 1, for written and reprinted)"
        run: mysql -h127.0.0.1 -uroot --force --skip-column-names < data/tidb/translation-seed6.sql | grep "count" || true
      - name: "issue 019: A INTERSECT (B INTERSECT C) with a DATE column (expected no row after I2, I3, I5, I7, I8, I9)"
        run: mysql -h127.0.0.1 -uroot --force --skip-column-names < data/tidb/intersect-date-int.sql || true
      - name: Campaign over random databases (the candidates are printed, not judged)
        run: |
          python3 bridge/campaign_mysql.py --seeds 1-8 --queries 30 --focus --value-ext --tidb --out /tmp/campaign.jsonl | grep -v '^  ' | cut -c1-1500
          if [ -s /tmp/campaign.jsonl ]; then python3 scripts/triage_mysql.py /tmp/campaign.jsonl --out-dir /tmp/triage --timeout 120; fi
